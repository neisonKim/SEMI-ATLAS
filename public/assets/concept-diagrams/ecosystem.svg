<svg xmlns="http://www.w3.org/2000/svg" width="360" height="490" viewBox="0 0 360 490" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">설계·제조·후공정과 지원 역할</title><desc id="diagram-desc">설계에서 제조·패키징 테스트·시스템으로 이어지는 역할과 옆에서 여러 단계를 지원하는 EDA IP 및 장비 소재。실제 기업의 거래 관계나 반드시 한 방향인 계약 흐름을 나타내지 않습니다.</desc><defs><marker id="arrow-ink" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#18394f"/></marker><marker id="arrow-cyan" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#076171"/></marker><marker id="arrow-amber" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#8b471b"/></marker></defs><rect width="360" height="490" fill="#f7fbfc"/><g font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif"><rect x="125" y="25" width="210" height="59" rx="6" fill="#d9f1f3" stroke="#adc6d3" stroke-width="1.5"/><text x="230" y="52" text-anchor="middle" font-size="16" fill="#18394f" font-weight="700">설계</text><text x="230" y="74" text-anchor="middle" font-size="14" fill="#425d70" font-weight="500">기능·회로 정의</text><rect x="125" y="135" width="210" height="59" rx="6" fill="#d9f1f3" stroke="#adc6d3" stroke-width="1.5"/><text x="230" y="162" text-anchor="middle" font-size="16" fill="#18394f" font-weight="700">제조</text><text x="230" y="184" text-anchor="middle" font-size="14" fill="#425d70" font-weight="500">웨이퍼에 구현</text><rect x="125" y="245" width="210" height="59" rx="6" fill="#d9f1f3" stroke="#adc6d3" stroke-width="1.5"/><text x="230" y="272" text-anchor="middle" font-size="16" fill="#18394f" font-weight="700">패키징·테스트</text><text x="230" y="294" text-anchor="middle" font-size="14" fill="#425d70" font-weight="500">연결·동작 확인</text><rect x="125" y="371" width="210" height="59" rx="6" fill="#d9f1f3" stroke="#adc6d3" stroke-width="1.5"/><text x="230" y="398" text-anchor="middle" font-size="16" fill="#18394f" font-weight="700">시스템</text><text x="230" y="420" text-anchor="middle" font-size="14" fill="#425d70" font-weight="500">제품에서 사용</text><line x1="230" y1="90" x2="230" y2="124" stroke="#076171" stroke-width="2" marker-end="url(#arrow-cyan)"/><line x1="230" y1="202" x2="230" y2="234" stroke="#076171" stroke-width="2" marker-end="url(#arrow-cyan)"/><line x1="230" y1="312" x2="230" y2="360" stroke="#076171" stroke-width="2" marker-end="url(#arrow-cyan)"/><rect x="18" y="25" width="86" height="59" rx="6" fill="#f5d5ad" stroke="#adc6d3" stroke-width="1.5"/><text x="61" y="52" text-anchor="middle" font-size="16" fill="#18394f" font-weight="700">EDA·IP</text><text x="61" y="74" text-anchor="middle" font-size="14" fill="#425d70" font-weight="500">설계 지원</text><line x1="106" y1="56" x2="119" y2="56" stroke="#8b471b" stroke-width="2" marker-end="url(#arrow-amber)"/><rect x="18" y="135" width="86" height="169" rx="6" fill="#e3f2e9" stroke="#adc6d3" stroke-width="1.5"/><text x="61" y="184" text-anchor="middle" font-size="16" fill="#18394f" font-weight="700">장비</text><text x="61" y="212" text-anchor="middle" font-size="16" fill="#18394f" font-weight="700">소재</text><text x="61" y="256" text-anchor="middle" font-size="14" fill="#425d70" font-weight="500">여러 단계</text><line x1="108" y1="164" x2="120" y2="164" stroke="#076171" stroke-width="2" marker-end="url(#arrow-cyan)"/><line x1="108" y1="275" x2="120" y2="275" stroke="#076171" stroke-width="2" marker-end="url(#arrow-cyan)"/><text x="180" y="471" text-anchor="middle" font-size="14" fill="#425d70" font-weight="500">한 기업이 여러 역할을 맡을 수도 있어요</text></g></svg>
