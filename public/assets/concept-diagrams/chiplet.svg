<svg xmlns="http://www.w3.org/2000/svg" width="360" height="420" viewBox="0 0 360 420" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">연산·입출력 칩렛과 다이 간 링크</title><desc id="diagram-desc">연산 다이와 입출력 다이가 같은 패키지의 다이 간 데이터 경로로 연결되는 구성。두 다이로 나눈 예시이며 특정 제품이나 특정 표준의 구현 배치는 아닙니다.</desc><defs><marker id="arrow-ink" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#18394f"/></marker><marker id="arrow-cyan" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#076171"/></marker><marker id="arrow-amber" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#8b471b"/></marker></defs><rect width="360" height="420" fill="#f7fbfc"/><g font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif"><text x="180" y="36" text-anchor="middle" font-size="17" fill="#18394f" font-weight="700">하나의 패키지 안에서 통신</text><rect x="22" y="79" width="316" height="251" rx="7" fill="#ffffff" stroke="#076171" stroke-width="1.5"/><line x1="54" y1="108" x2="54" y2="115" stroke="#18394f" stroke-width="2"/><line x1="54" y1="185" x2="54" y2="192" stroke="#18394f" stroke-width="2"/><line x1="76.25" y1="108" x2="76.25" y2="115" stroke="#18394f" stroke-width="2"/><line x1="76.25" y1="185" x2="76.25" y2="192" stroke="#18394f" stroke-width="2"/><line x1="98.5" y1="108" x2="98.5" y2="115" stroke="#18394f" stroke-width="2"/><line x1="98.5" y1="185" x2="98.5" y2="192" stroke="#18394f" stroke-width="2"/><line x1="120.75" y1="108" x2="120.75" y2="115" stroke="#18394f" stroke-width="2"/><line x1="120.75" y1="185" x2="120.75" y2="192" stroke="#18394f" stroke-width="2"/><line x1="143" y1="108" x2="143" y2="115" stroke="#18394f" stroke-width="2"/><line x1="143" y1="185" x2="143" y2="192" stroke="#18394f" stroke-width="2"/><rect x="42" y="115" width="113" height="70" rx="4" fill="#b9d7e8" stroke="#076171" stroke-width="1.5"/><text x="98.5" y="155" text-anchor="middle" font-size="15" fill="#18394f" font-weight="700">연산 다이</text><line x1="217" y1="108" x2="217" y2="115" stroke="#18394f" stroke-width="2"/><line x1="217" y1="185" x2="217" y2="192" stroke="#18394f" stroke-width="2"/><line x1="239.25" y1="108" x2="239.25" y2="115" stroke="#18394f" stroke-width="2"/><line x1="239.25" y1="185" x2="239.25" y2="192" stroke="#18394f" stroke-width="2"/><line x1="261.5" y1="108" x2="261.5" y2="115" stroke="#18394f" stroke-width="2"/><line x1="261.5" y1="185" x2="261.5" y2="192" stroke="#18394f" stroke-width="2"/><line x1="283.75" y1="108" x2="283.75" y2="115" stroke="#18394f" stroke-width="2"/><line x1="283.75" y1="185" x2="283.75" y2="192" stroke="#18394f" stroke-width="2"/><line x1="306" y1="108" x2="306" y2="115" stroke="#18394f" stroke-width="2"/><line x1="306" y1="185" x2="306" y2="192" stroke="#18394f" stroke-width="2"/><rect x="205" y="115" width="113" height="70" rx="4" fill="#b9d7e8" stroke="#076171" stroke-width="1.5"/><text x="261.5" y="155" text-anchor="middle" font-size="15" fill="#18394f" font-weight="700">I/O 다이</text><line x1="99" y1="187" x2="99" y2="238" stroke="#076171" stroke-width="2"/><line x1="261" y1="187" x2="261" y2="238" stroke="#076171" stroke-width="2"/><line x1="111" y1="225" x2="249" y2="225" stroke="#076171" stroke-width="2" marker-end="url(#arrow-cyan)"/><line x1="249" y1="242" x2="111" y2="242" stroke="#076171" stroke-width="2" marker-end="url(#arrow-cyan)"/><text x="180" y="272" text-anchor="middle" font-size="15" fill="#076171" font-weight="700">다이 간 데이터 연결</text><text x="180" y="309" text-anchor="middle" font-size="15" fill="#18394f" font-weight="500">공동 패키지</text><text x="180" y="369" text-anchor="middle" font-size="15" fill="#425d70" font-weight="500">기능별 다이와 링크를 함께 설계</text></g></svg>
