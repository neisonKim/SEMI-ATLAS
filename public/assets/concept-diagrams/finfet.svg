<svg xmlns="http://www.w3.org/2000/svg" width="360" height="420" viewBox="0 0 360 420" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">게이트가 핀을 감싸는 단면</title><desc id="diagram-desc">실리콘 핀의 윗면과 양옆을 절연막과 게이트가 감싸는 트라이게이트 단면。소스·드레인은 단면 앞뒤에 있어 생략했습니다. 치수는 축척이 아닙니다.</desc><defs><marker id="arrow-ink" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#18394f"/></marker><marker id="arrow-cyan" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#076171"/></marker><marker id="arrow-amber" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#8b471b"/></marker></defs><rect width="360" height="420" fill="#f7fbfc"/><g font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif"><text x="180" y="35" text-anchor="middle" font-size="17" fill="#18394f" font-weight="700">FinFET · 핀에 수직인 단면</text><path d="M96 277 V98 H264 V277 H223 V139 H137 V277 Z" fill="#d9f1f3" stroke="#076171" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M137 277 V139 H223 V277 H212 V150 H148 V277 Z" fill="#f5d5ad" stroke="#8b471b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="148" y="150" width="64" height="127" rx="0" fill="#b9d7e8" stroke="#076171" stroke-width="1.5"/><rect x="30" y="277" width="300" height="55" rx="2" fill="#dfe8ed" stroke="#adc6d3" stroke-width="1.5"/><text x="180" y="309.5" text-anchor="middle" font-size="15" fill="#18394f" font-weight="500">실리콘 기판</text><text x="180" y="125" text-anchor="middle" font-size="15" fill="#076171" font-weight="700">게이트</text><text x="180" y="217" text-anchor="middle" font-size="16" fill="#18394f" font-weight="500">핀</text><line x1="223" y1="193" x2="275" y2="193" stroke="#8b471b" stroke-width="1.5"/><text x="271" y="178" text-anchor="middle" font-size="14" fill="#8b471b" font-weight="500">절연막</text><text x="180" y="366" text-anchor="middle" font-size="15" fill="#18394f" font-weight="700">윗면과 양옆에서 채널 제어</text></g></svg>
