<svg xmlns="http://www.w3.org/2000/svg" width="360" height="420" viewBox="0 0 360 420" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">두 검사 단계에서의 수율 분모</title><desc id="diagram-desc">가상 다이가 웨이퍼 테스트를 거치고 통과한 다이만 조립과 최종 테스트로 넘어가는 흐름。단계별로 다른 분모를 보여줍니다. 중간 재검과 등급 분류는 생략했습니다.</desc><defs><marker id="arrow-ink" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#18394f"/></marker><marker id="arrow-cyan" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#076171"/></marker><marker id="arrow-amber" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#8b471b"/></marker></defs><rect width="360" height="420" fill="#f7fbfc"/><g font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif"><rect x="61" y="20" width="238" height="60" rx="6" fill="#d9f1f3" stroke="#adc6d3" stroke-width="1.5"/><text x="180" y="56" text-anchor="middle" font-size="16" fill="#18394f" font-weight="700">검사 대상 다이 500개</text><line x1="180" y1="86" x2="180" y2="114" stroke="#076171" stroke-width="2" marker-end="url(#arrow-cyan)"/><rect x="61" y="124" width="238" height="63" rx="6" fill="#d9f1f3" stroke="#adc6d3" stroke-width="1.5"/><text x="180" y="151" text-anchor="middle" font-size="16" fill="#18394f" font-weight="700">웨이퍼 테스트</text><text x="180" y="173" text-anchor="middle" font-size="14" fill="#425d70" font-weight="500">450개 합격 · 90%</text><line x1="180" y1="194" x2="180" y2="222" stroke="#076171" stroke-width="2" marker-end="url(#arrow-cyan)"/><rect x="61" y="231" width="238" height="59" rx="6" fill="#f5d5ad" stroke="#adc6d3" stroke-width="1.5"/><text x="180" y="266.5" text-anchor="middle" font-size="16" fill="#18394f" font-weight="700">합격 다이 조립</text><line x1="180" y1="298" x2="180" y2="326" stroke="#076171" stroke-width="2" marker-end="url(#arrow-cyan)"/><rect x="61" y="336" width="238" height="63" rx="6" fill="#d9f1f3" stroke="#adc6d3" stroke-width="1.5"/><text x="180" y="363" text-anchor="middle" font-size="16" fill="#18394f" font-weight="700">최종 테스트</text><text x="180" y="385" text-anchor="middle" font-size="14" fill="#425d70" font-weight="500">분모는 조립한 450개</text></g></svg>
