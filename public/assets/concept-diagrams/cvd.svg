<svg xmlns="http://www.w3.org/2000/svg" width="360" height="420" viewBox="0 0 360 420" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">CVD 챔버의 공급·반응·배출</title><desc id="diagram-desc">챔버 안으로 원료 기체가 들어와 가열된 기판 표면에 막을 만들고 부산물이 배출되는 관계。열 CVD의 기능을 단순화했으며 플라즈마·가스 분배·반응 경로의 상세 구조는 생략했습니다.</desc><defs><marker id="arrow-ink" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#18394f"/></marker><marker id="arrow-cyan" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#076171"/></marker><marker id="arrow-amber" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#8b471b"/></marker></defs><rect width="360" height="420" fill="#f7fbfc"/><g font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif"><rect x="30" y="82" width="300" height="257" rx="6" fill="#ffffff" stroke="#adc6d3" stroke-width="1.5"/><text x="180" y="28" text-anchor="middle" font-size="16" fill="#18394f" font-weight="700">기체 공급 → 표면 반응 → 배출</text><text x="123" y="66" text-anchor="middle" font-size="15" fill="#8b471b" font-weight="500">원료 기체</text><line x1="124" y1="72" x2="124" y2="133" stroke="#8b471b" stroke-width="2" marker-end="url(#arrow-amber)"/><circle cx="90" cy="159" r="5" fill="#8b471b"/><circle cx="133" cy="159" r="5" fill="#8b471b"/><circle cx="179" cy="159" r="5" fill="#8b471b"/><circle cx="221" cy="159" r="5" fill="#8b471b"/><circle cx="266" cy="159" r="5" fill="#8b471b"/><circle cx="112" cy="195" r="4" fill="#076171"/><circle cx="168" cy="195" r="4" fill="#076171"/><circle cx="235" cy="195" r="4" fill="#076171"/><line x1="181" y1="186" x2="181" y2="227" stroke="#076171" stroke-width="2" marker-end="url(#arrow-cyan)"/><rect x="63" y="241" width="234" height="13" rx="1" fill="#d9f1f3" stroke="#076171" stroke-width="1.5"/><rect x="63" y="254" width="234" height="30" rx="1" fill="#dfe8ed" stroke="#adc6d3" stroke-width="1.5"/><text x="180" y="310" text-anchor="middle" font-size="15" fill="#18394f" font-weight="500">기판 · 열 공급</text><path d="M293 202 H343 V148" fill="none" stroke="#8b471b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-amber)"/><text x="295" y="137" text-anchor="middle" font-size="14" fill="#8b471b" font-weight="500">부산물</text><text x="180" y="375" text-anchor="middle" font-size="16" fill="#076171" font-weight="700">화학 반응으로 고체 막 형성</text><text x="180" y="406" text-anchor="middle" font-size="14" fill="#425d70" font-weight="500">가스 분배·장비 상세는 생략</text></g></svg>
