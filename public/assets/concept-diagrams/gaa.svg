<svg xmlns="http://www.w3.org/2000/svg" width="360" height="420" viewBox="0 0 360 420" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">나노시트마다 둘러싼 게이트 단면</title><desc id="diagram-desc">세 나노시트 각각의 네 면을 절연막과 공통 게이트가 둘러싸는 채널 단면。시트 수는 예시이며 소스·드레인, 간격과 배선은 단순화했습니다.</desc><defs><marker id="arrow-ink" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#18394f"/></marker><marker id="arrow-cyan" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#076171"/></marker><marker id="arrow-amber" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#8b471b"/></marker></defs><rect width="360" height="420" fill="#f7fbfc"/><g font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif"><text x="180" y="35" text-anchor="middle" font-size="17" fill="#18394f" font-weight="700">GAA · 시트에 수직인 단면</text><rect x="71" y="64" width="218" height="238" rx="8" fill="#d9f1f3" stroke="#076171" stroke-width="1.5"/><text x="180" y="91" text-anchor="middle" font-size="16" fill="#076171" font-weight="700">공통 게이트</text><rect x="118" y="109" width="124" height="45" rx="8" fill="#f5d5ad" stroke="#8b471b" stroke-width="1.5"/><rect x="126" y="117" width="108" height="29" rx="5" fill="#b9d7e8" stroke="#076171" stroke-width="1.5"/><text x="180" y="137" text-anchor="middle" font-size="15" fill="#18394f" font-weight="500">채널</text><rect x="118" y="173" width="124" height="45" rx="8" fill="#f5d5ad" stroke="#8b471b" stroke-width="1.5"/><rect x="126" y="181" width="108" height="29" rx="5" fill="#b9d7e8" stroke="#076171" stroke-width="1.5"/><text x="180" y="201" text-anchor="middle" font-size="15" fill="#18394f" font-weight="500">채널</text><rect x="118" y="237" width="124" height="45" rx="8" fill="#f5d5ad" stroke="#8b471b" stroke-width="1.5"/><rect x="126" y="245" width="108" height="29" rx="5" fill="#b9d7e8" stroke="#076171" stroke-width="1.5"/><text x="180" y="265" text-anchor="middle" font-size="15" fill="#18394f" font-weight="500">채널</text><line x1="238" y1="261" x2="306" y2="322" stroke="#8b471b" stroke-width="1.5"/><text x="280" y="346" text-anchor="middle" font-size="14" fill="#8b471b" font-weight="500">둘레 절연막</text><text x="180" y="387" text-anchor="middle" font-size="15" fill="#18394f" font-weight="700">각 시트의 아래쪽도 제어</text></g></svg>
