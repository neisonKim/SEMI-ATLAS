<svg xmlns="http://www.w3.org/2000/svg" width="360" height="420" viewBox="0 0 360 420" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">슬러리·패드·상대 운동과 평탄화</title><desc id="diagram-desc">패드와 웨이퍼 사이에 슬러리를 공급하고 상대 운동으로 높낮이를 줄여 다음 층의 가공면을 만드는 CMP 개념。평탄화 목표를 표시하며 실제 제거율·압력·디싱 형상은 생략했습니다.</desc><defs><marker id="arrow-ink" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#18394f"/></marker><marker id="arrow-cyan" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#076171"/></marker><marker id="arrow-amber" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#8b471b"/></marker></defs><rect width="360" height="420" fill="#f7fbfc"/><g font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif"><text x="180" y="28" text-anchor="middle" font-size="16" fill="#18394f" font-weight="700">패드와 웨이퍼의 상대 운동</text><rect x="38" y="70" width="284" height="37" rx="2" fill="#dfe8ed" stroke="#adc6d3" stroke-width="1.5"/><text x="180" y="95" text-anchor="middle" font-size="16" fill="#18394f" font-weight="500">연마 패드</text><line x1="82" y1="53" x2="278" y2="53" stroke="#076171" stroke-width="2" marker-end="url(#arrow-cyan)"/><circle cx="81" cy="126" r="4" fill="#076171"/><circle cx="141" cy="126" r="4" fill="#076171"/><circle cx="201" cy="126" r="4" fill="#076171"/><circle cx="261" cy="126" r="4" fill="#076171"/><text x="180" y="152" text-anchor="middle" font-size="14" fill="#076171" font-weight="500">슬러리</text><path d="M38 236 V190 H98 V174 H157 V203 H215 V185 H279 V195 H322 V236 Z" fill="#b9d7e8" stroke="#076171" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><text x="180" y="226" text-anchor="middle" font-size="15" fill="#18394f" font-weight="500">웨이퍼의 높낮이</text><line x1="180" y1="253" x2="180" y2="282" stroke="#076171" stroke-width="2" marker-end="url(#arrow-cyan)"/><text x="180" y="310" text-anchor="middle" font-size="16" fill="#18394f" font-weight="700">평탄화 목표</text><rect x="38" y="334" width="284" height="53" rx="1" fill="#b9d7e8" stroke="#076171" stroke-width="1.5"/><line x1="38" y1="334" x2="322" y2="334" stroke="#076171" stroke-width="3"/><text x="180" y="412" text-anchor="middle" font-size="14" fill="#425d70" font-weight="500">디싱·침식·재료별 제거율도 관리</text></g></svg>
