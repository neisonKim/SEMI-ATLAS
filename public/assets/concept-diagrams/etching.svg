<svg xmlns="http://www.w3.org/2000/svg" width="360" height="420" viewBox="0 0 360 420" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">마스크가 보호하는 부분과 제거 영역</title><desc id="diagram-desc">보호 마스크 아래 막은 남고 노출된 가운데 막이 제거되는 방향성 식각 전후 비교。방향성 식각의 예시이며 실제 선택비·옆면 형상·손상은 조건마다 다릅니다.</desc><defs><marker id="arrow-ink" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#18394f"/></marker><marker id="arrow-cyan" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#076171"/></marker><marker id="arrow-amber" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#8b471b"/></marker></defs><rect width="360" height="420" fill="#f7fbfc"/><g font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif"><text x="180" y="29" text-anchor="middle" font-size="16" fill="#18394f" font-weight="700">① 노출된 막과 보호 마스크</text><rect x="30" y="123" width="300" height="47" rx="2" fill="#dfe8ed" stroke="#adc6d3" stroke-width="1.5"/><text x="180" y="151.5" text-anchor="middle" font-size="15" fill="#18394f" font-weight="500">아래층</text><rect x="30" y="96" width="300" height="27" rx="1" fill="#b9d7e8" stroke="#076171" stroke-width="1.5"/><rect x="30" y="78" width="92" height="18" rx="1" fill="#f5d5ad" stroke="#8b471b" stroke-width="1.5"/><rect x="238" y="78" width="92" height="18" rx="1" fill="#f5d5ad" stroke="#8b471b" stroke-width="1.5"/><line x1="154" y1="53" x2="154" y2="88" stroke="#8b471b" stroke-width="2" marker-end="url(#arrow-amber)"/><line x1="202" y1="53" x2="202" y2="88" stroke="#8b471b" stroke-width="2" marker-end="url(#arrow-amber)"/><line x1="180" y1="185" x2="180" y2="220" stroke="#076171" stroke-width="2" marker-end="url(#arrow-cyan)"/><text x="180" y="249" text-anchor="middle" font-size="16" fill="#18394f" font-weight="700">② 노출 영역을 제거한 예시</text><rect x="30" y="337" width="300" height="48" rx="2" fill="#dfe8ed" stroke="#adc6d3" stroke-width="1.5"/><text x="180" y="366" text-anchor="middle" font-size="15" fill="#18394f" font-weight="500">아래층·선택비도 관리</text><rect x="30" y="310" width="92" height="27" rx="1" fill="#b9d7e8" stroke="#076171" stroke-width="1.5"/><rect x="238" y="310" width="92" height="27" rx="1" fill="#b9d7e8" stroke="#076171" stroke-width="1.5"/><rect x="30" y="292" width="92" height="18" rx="1" fill="#f5d5ad" stroke="#8b471b" stroke-width="1.5"/><rect x="238" y="292" width="92" height="18" rx="1" fill="#f5d5ad" stroke="#8b471b" stroke-width="1.5"/><text x="180" y="328" text-anchor="middle" font-size="15" fill="#8b471b" font-weight="500">제거</text><text x="180" y="414" text-anchor="middle" font-size="14" fill="#425d70" font-weight="500">형상·균일도·손상을 함께 확인</text></g></svg>
