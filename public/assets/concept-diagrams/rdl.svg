<svg xmlns="http://www.w3.org/2000/svg" width="360" height="420" viewBox="0 0 360 420" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">다이 패드를 바깥 접점으로 잇는 RDL</title><desc id="diagram-desc">다이 안쪽의 두 패드에서 시작한 금속선이 몰드 영역으로 뻗어 바깥쪽 범프에 이어지는 단면。한 층의 팬아웃 연결만 나타냈습니다. 재료 치수와 전체 공정 순서는 생략했습니다.</desc><defs><marker id="arrow-ink" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#18394f"/></marker><marker id="arrow-cyan" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#076171"/></marker><marker id="arrow-amber" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#8b471b"/></marker></defs><rect width="360" height="420" fill="#f7fbfc"/><g font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif"><text x="180" y="35" text-anchor="middle" font-size="17" fill="#18394f" font-weight="700">팬아웃 재배선의 단면</text><text x="180" y="85" text-anchor="middle" font-size="15" fill="#8b471b" font-weight="700">다이 바깥의 새 접점</text><circle cx="64" cy="140" r="14" fill="#f5d5ad"/><circle cx="296" cy="140" r="14" fill="#f5d5ad"/><rect x="28" y="157" width="304" height="49" rx="1" fill="#dfe8ed" stroke="#adc6d3" stroke-width="1.5"/><rect x="28" y="206" width="304" height="101" rx="2" fill="#d9f1f3" stroke="#adc6d3" stroke-width="1.5"/><rect x="116" y="206" width="128" height="101" rx="1" fill="#b9d7e8" stroke="#076171" stroke-width="1.5"/><rect x="128" y="203" width="24" height="8" rx="1" fill="#f5d5ad" stroke="#8b471b" stroke-width="1.5"/><rect x="208" y="203" width="24" height="8" rx="1" fill="#f5d5ad" stroke="#8b471b" stroke-width="1.5"/><path d="M64 154 V179 H140 V203 M296 154 V179 H220 V203" fill="none" stroke="#8b471b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="180" y="267" text-anchor="middle" font-size="16" fill="#18394f" font-weight="500">다이</text><text x="72" y="268" text-anchor="middle" font-size="14" fill="#18394f" font-weight="500">몰드</text><text x="285" y="268" text-anchor="middle" font-size="14" fill="#18394f" font-weight="500">몰드</text><text x="180" y="345" text-anchor="middle" font-size="15" fill="#8b471b" font-weight="500">금속선이 기존 패드를 연장</text></g></svg>
