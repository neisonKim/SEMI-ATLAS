<svg xmlns="http://www.w3.org/2000/svg" width="360" height="420" viewBox="0 0 360 420" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">제어 입력과 전류 경로</title><desc id="diagram-desc">제어 입력이 전류 경로의 열림과 닫힘에 영향을 주고 여러 소자가 논리 회로로 연결되는 모습。특정 트랜지스터 종류의 단면이나 표준 회로 기호가 아닌 기능도입니다.</desc><defs><marker id="arrow-ink" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#18394f"/></marker><marker id="arrow-cyan" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#076171"/></marker><marker id="arrow-amber" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#8b471b"/></marker></defs><rect width="360" height="420" fill="#f7fbfc"/><g font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif"><text x="180" y="33" text-anchor="middle" font-size="17" fill="#18394f" font-weight="700">입력으로 다른 전류를 제어</text><rect x="80" y="65" width="200" height="56" rx="6" fill="#d9f1f3" stroke="#adc6d3" stroke-width="1.5"/><text x="180" y="99" text-anchor="middle" font-size="16" fill="#18394f" font-weight="700">제어 입력</text><line x1="180" y1="125" x2="180" y2="161" stroke="#8b471b" stroke-width="2" marker-end="url(#arrow-amber)"/><rect x="96" y="169" width="168" height="111" rx="6" fill="#d9f1f3" stroke="#076171" stroke-width="1.5"/><text x="180" y="198" text-anchor="middle" font-size="16" fill="#18394f" font-weight="700">전류 제어부</text><line x1="18" y1="242" x2="112" y2="242" stroke="#076171" stroke-width="2" marker-end="url(#arrow-cyan)"/><line x1="124" y1="242" x2="170" y2="242" stroke="#18394f" stroke-width="2"/><line x1="170" y1="242" x2="200" y2="222" stroke="#8b471b" stroke-width="3"/><line x1="205" y1="242" x2="251" y2="242" stroke="#18394f" stroke-width="2"/><line x1="265" y1="242" x2="341" y2="242" stroke="#076171" stroke-width="2" marker-end="url(#arrow-cyan)"/><text x="42" y="221" text-anchor="middle" font-size="14" fill="#076171" font-weight="500">전류</text><text x="313" y="221" text-anchor="middle" font-size="14" fill="#076171" font-weight="500">출력</text><line x1="180" y1="288" x2="180" y2="323" stroke="#076171" stroke-width="2" marker-end="url(#arrow-cyan)"/><line x1="92" y1="333" x2="92" y2="340" stroke="#18394f" stroke-width="2"/><line x1="92" y1="393" x2="92" y2="400" stroke="#18394f" stroke-width="2"/><line x1="136" y1="333" x2="136" y2="340" stroke="#18394f" stroke-width="2"/><line x1="136" y1="393" x2="136" y2="400" stroke="#18394f" stroke-width="2"/><line x1="180" y1="333" x2="180" y2="340" stroke="#18394f" stroke-width="2"/><line x1="180" y1="393" x2="180" y2="400" stroke="#18394f" stroke-width="2"/><line x1="224" y1="333" x2="224" y2="340" stroke="#18394f" stroke-width="2"/><line x1="224" y1="393" x2="224" y2="400" stroke="#18394f" stroke-width="2"/><line x1="268" y1="333" x2="268" y2="340" stroke="#18394f" stroke-width="2"/><line x1="268" y1="393" x2="268" y2="400" stroke="#18394f" stroke-width="2"/><rect x="80" y="340" width="200" height="53" rx="4" fill="#b9d7e8" stroke="#076171" stroke-width="1.5"/><text x="180" y="371.5" text-anchor="middle" font-size="15" fill="#18394f" font-weight="700">여러 소자 → 논리 기능</text></g></svg>
