<svg xmlns="http://www.w3.org/2000/svg" width="360" height="450" viewBox="0 0 360 450" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">감광재에 패턴을 만드는 과정</title><desc id="diagram-desc">감광재 도포, 빛과 마스크로 패턴 정보 전달, 현상한 감광재 패턴의 세 단계를 표시。현상 형상은 예시이며 감광재 종류에 따라 남는 영역이 달라집니다.</desc><defs><marker id="arrow-ink" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#18394f"/></marker><marker id="arrow-cyan" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#076171"/></marker><marker id="arrow-amber" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#8b471b"/></marker></defs><rect width="360" height="450" fill="#f7fbfc"/><g font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif"><text x="180" y="26" text-anchor="middle" font-size="16" fill="#18394f" font-weight="700">① 감광재 도포</text><rect x="30" y="68" width="300" height="39" rx="2" fill="#dfe8ed" stroke="#adc6d3" stroke-width="1.5"/><text x="180" y="92.5" text-anchor="middle" font-size="15" fill="#18394f" font-weight="500">가공할 막·기판</text><rect x="30" y="53" width="300" height="15" rx="1" fill="#f5d5ad" stroke="#8b471b" stroke-width="1.5"/><text x="180" y="140" text-anchor="middle" font-size="16" fill="#18394f" font-weight="700">② 빛으로 패턴 정보 전달</text><rect x="65" y="164" width="230" height="13" rx="1" fill="#18394f" stroke="#18394f" stroke-width="1.5"/><rect x="136" y="164" width="88" height="13" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/><line x1="165" y1="182" x2="165" y2="211" stroke="#8b471b" stroke-width="2" marker-end="url(#arrow-amber)"/><line x1="196" y1="182" x2="196" y2="211" stroke="#8b471b" stroke-width="2" marker-end="url(#arrow-amber)"/><rect x="30" y="220" width="300" height="15" rx="1" fill="#f5d5ad" stroke="#8b471b" stroke-width="1.5"/><rect x="30" y="235" width="300" height="39" rx="2" fill="#dfe8ed" stroke="#adc6d3" stroke-width="1.5"/><text x="180" y="259.5" text-anchor="middle" font-size="15" fill="#18394f" font-weight="500">아래 재료는 아직 가공 전</text><text x="180" y="316" text-anchor="middle" font-size="16" fill="#18394f" font-weight="700">③ 현상한 감광재 패턴</text><rect x="30" y="361" width="300" height="43" rx="2" fill="#dfe8ed" stroke="#adc6d3" stroke-width="1.5"/><text x="180" y="387.5" text-anchor="middle" font-size="15" fill="#18394f" font-weight="500">후속 식각·이온주입 등에 활용</text><rect x="30" y="343" width="92" height="18" rx="1" fill="#f5d5ad" stroke="#8b471b" stroke-width="1.5"/><rect x="238" y="343" width="92" height="18" rx="1" fill="#f5d5ad" stroke="#8b471b" stroke-width="1.5"/><text x="180" y="437" text-anchor="middle" font-size="14" fill="#425d70" font-weight="500">남는 영역은 감광재 종류에 따라 다름</text></g></svg>
