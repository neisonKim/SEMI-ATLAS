<svg xmlns="http://www.w3.org/2000/svg" width="360" height="420" viewBox="0 0 360 420" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">원료 공급과 표면의 박막 형성</title><desc id="diagram-desc">원료가 표면에 공급되고 기판 위에 새로운 얇은 막이 형성되는 과정。평면 막의 예시이며 피복성·성장 속도·반응 방식은 증착법마다 다릅니다.</desc><defs><marker id="arrow-ink" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#18394f"/></marker><marker id="arrow-cyan" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#076171"/></marker><marker id="arrow-amber" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#8b471b"/></marker></defs><rect width="360" height="420" fill="#f7fbfc"/><g font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif"><text x="180" y="29" text-anchor="middle" font-size="17" fill="#18394f" font-weight="700">원료를 표면으로 공급</text><circle cx="77" cy="76" r="6" fill="#8b471b"/><circle cx="125" cy="76" r="6" fill="#8b471b"/><circle cx="174" cy="76" r="6" fill="#8b471b"/><circle cx="222" cy="76" r="6" fill="#8b471b"/><circle cx="270" cy="76" r="6" fill="#8b471b"/><circle cx="105" cy="115" r="5" fill="#8b471b"/><circle cx="201" cy="115" r="5" fill="#8b471b"/><circle cx="295" cy="115" r="5" fill="#8b471b"/><line x1="90" y1="142" x2="90" y2="189" stroke="#8b471b" stroke-width="2" marker-end="url(#arrow-amber)"/><line x1="180" y1="142" x2="180" y2="189" stroke="#8b471b" stroke-width="2" marker-end="url(#arrow-amber)"/><line x1="270" y1="142" x2="270" y2="189" stroke="#8b471b" stroke-width="2" marker-end="url(#arrow-amber)"/><rect x="30" y="218" width="300" height="24" rx="1" fill="#d9f1f3" stroke="#076171" stroke-width="1.5"/><rect x="30" y="242" width="300" height="83" rx="2" fill="#dfe8ed" stroke="#adc6d3" stroke-width="1.5"/><text x="180" y="288.5" text-anchor="middle" font-size="15" fill="#18394f" font-weight="500">기판</text><text x="180" y="211" text-anchor="middle" font-size="16" fill="#076171" font-weight="700">새로 형성되는 박막</text><text x="180" y="365" text-anchor="middle" font-size="15" fill="#18394f" font-weight="500">두께·조성·균일도·결함 관리</text><text x="180" y="403" text-anchor="middle" font-size="14" fill="#425d70" font-weight="500">실제 덮이는 모양은 방법마다 다릅니다</text></g></svg>
