<svg xmlns="http://www.w3.org/2000/svg" width="360" height="420" viewBox="0 0 360 420" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">선택한 영역의 주입과 후속 열처리</title><desc id="diagram-desc">마스크 사이로 가속된 이온이 기판 내부에 분포하고 이후 열처리로 손상 회복과 활성화를 진행하는 관계。주입 분포·점 개수·깊이는 실제 수치가 아니며 제조 조건을 제시하지 않습니다.</desc><defs><marker id="arrow-ink" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#18394f"/></marker><marker id="arrow-cyan" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#076171"/></marker><marker id="arrow-amber" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#8b471b"/></marker></defs><rect width="360" height="420" fill="#f7fbfc"/><g font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif"><text x="180" y="28" text-anchor="middle" font-size="16" fill="#18394f" font-weight="700">선택한 이온을 가속해 주입</text><circle cx="151" cy="65" r="5" fill="#8b471b"/><circle cx="180" cy="65" r="5" fill="#8b471b"/><circle cx="209" cy="65" r="5" fill="#8b471b"/><line x1="151" y1="82" x2="151" y2="130" stroke="#8b471b" stroke-width="2" marker-end="url(#arrow-amber)"/><line x1="180" y1="82" x2="180" y2="130" stroke="#8b471b" stroke-width="2" marker-end="url(#arrow-amber)"/><line x1="209" y1="82" x2="209" y2="130" stroke="#8b471b" stroke-width="2" marker-end="url(#arrow-amber)"/><rect x="30" y="145" width="300" height="135" rx="1" fill="#dfe8ed" stroke="#adc6d3" stroke-width="1.5"/><rect x="30" y="131" width="91" height="14" rx="1" fill="#f5d5ad" stroke="#8b471b" stroke-width="1.5"/><rect x="239" y="131" width="91" height="14" rx="1" fill="#f5d5ad" stroke="#8b471b" stroke-width="1.5"/><circle cx="145" cy="173" r="4" fill="#076171"/><circle cx="180" cy="183" r="4" fill="#076171"/><circle cx="218" cy="193" r="4" fill="#076171"/><circle cx="153" cy="215" r="4" fill="#076171"/><circle cx="195" cy="225" r="4" fill="#076171"/><circle cx="171" cy="245" r="4" fill="#076171"/><circle cx="223" cy="233" r="4" fill="#076171"/><text x="180" y="305" text-anchor="middle" font-size="15" fill="#076171" font-weight="500">에너지: 깊이·분포</text><text x="180" y="331" text-anchor="middle" font-size="15" fill="#8b471b" font-weight="500">도즈: 면적당 주입량</text><line x1="180" y1="342" x2="180" y2="360" stroke="#076171" stroke-width="2" marker-end="url(#arrow-cyan)"/><rect x="30" y="368" width="300" height="39" rx="6" fill="#d9f1f3" stroke="#adc6d3" stroke-width="1.5"/><text x="180" y="393.5" text-anchor="middle" font-size="16" fill="#18394f" font-weight="700">열처리 · 손상 회복·활성화</text></g></svg>
