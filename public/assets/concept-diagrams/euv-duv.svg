<svg xmlns="http://www.w3.org/2000/svg" width="360" height="420" viewBox="0 0 360 420" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">DUV의 렌즈와 EUV의 반사 미러</title><desc id="diagram-desc">DUV는 렌즈를 지나는 개념 경로, EUV는 진공 안에서 미러로 반사하는 개념 경로로 비교。ArF DUV 예시와 EUV 원리 비교이며 실제 광로·배율·부품 수는 생략했습니다.</desc><defs><marker id="arrow-ink" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#18394f"/></marker><marker id="arrow-cyan" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#076171"/></marker><marker id="arrow-amber" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#8b471b"/></marker></defs><rect width="360" height="420" fill="#f7fbfc"/><g font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif"><rect x="20" y="20" width="320" height="168" rx="6" fill="#ffffff" stroke="#adc6d3" stroke-width="1.5"/><text x="180" y="50" text-anchor="middle" font-size="16" fill="#18394f" font-weight="700">ArF DUV · 193 nm 예시</text><line x1="48" y1="113" x2="124" y2="113" stroke="#8b471b" stroke-width="2" marker-end="url(#arrow-amber)"/><ellipse cx="150" cy="113" rx="13" ry="40" fill="#d9f1f3" stroke="#076171" stroke-width="2"/><line x1="166" y1="113" x2="278" y2="113" stroke="#8b471b" stroke-width="2" marker-end="url(#arrow-amber)"/><line x1="290" y1="78" x2="290" y2="150" stroke="#18394f" stroke-width="5"/><text x="150" y="171" text-anchor="middle" font-size="15" fill="#076171" font-weight="500">렌즈 중심 광학계</text><rect x="20" y="210" width="320" height="190" rx="6" fill="#d9f1f3" stroke="#adc6d3" stroke-width="1.5"/><text x="180" y="240" text-anchor="middle" font-size="16" fill="#18394f" font-weight="700">EUV · 약 13.5 nm</text><path d="M48 283 H119 L209 340 H290" fill="none" stroke="#8b471b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-amber)"/><line x1="111" y1="291" x2="129" y2="272" stroke="#18394f" stroke-width="5"/><line x1="201" y1="348" x2="219" y2="330" stroke="#18394f" stroke-width="5"/><line x1="298" y1="307" x2="298" y2="366" stroke="#18394f" stroke-width="5"/><text x="180" y="384" text-anchor="middle" font-size="15" fill="#076171" font-weight="500">진공 환경 · 반사 미러</text></g></svg>
