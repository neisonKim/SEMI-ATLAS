<svg xmlns="http://www.w3.org/2000/svg" width="360" height="420" viewBox="0 0 360 420" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">설계 주력 회사와 외부 제조 파트너</title><desc id="diagram-desc">팹리스 회사가 제품 기획과 회로 설계를 맡고 외부 파운드리·패키징 테스트 파트너와 협력하는 관계。파트너 계약과 업무 분담은 제품마다 다르며 실제 거래 관계를 추정하지 않습니다.</desc><defs><marker id="arrow-ink" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#18394f"/></marker><marker id="arrow-cyan" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#076171"/></marker><marker id="arrow-amber" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#8b471b"/></marker></defs><rect width="360" height="420" fill="#f7fbfc"/><g font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif"><rect x="30" y="20" width="300" height="133" rx="6" fill="#ffffff" stroke="#076171" stroke-width="1.5"/><text x="180" y="49" text-anchor="middle" font-size="17" fill="#18394f" font-weight="700">팹리스 회사</text><rect x="47" y="71" width="126" height="61" rx="6" fill="#d9f1f3" stroke="#adc6d3" stroke-width="1.5"/><text x="110" y="98" text-anchor="middle" font-size="16" fill="#18394f" font-weight="700">제품 기획</text><text x="110" y="120" text-anchor="middle" font-size="14" fill="#425d70" font-weight="500">기능·요구 정의</text><rect x="187" y="71" width="126" height="61" rx="6" fill="#d9f1f3" stroke="#adc6d3" stroke-width="1.5"/><text x="250" y="98" text-anchor="middle" font-size="16" fill="#18394f" font-weight="700">회로 설계</text><text x="250" y="120" text-anchor="middle" font-size="14" fill="#425d70" font-weight="500">공정 규칙 고려</text><line x1="180" y1="163" x2="180" y2="193" stroke="#076171" stroke-width="2" marker-end="url(#arrow-cyan)"/><rect x="45" y="204" width="270" height="64" rx="6" fill="#b9d7e8" stroke="#adc6d3" stroke-width="1.5"/><text x="180" y="231" text-anchor="middle" font-size="16" fill="#18394f" font-weight="700">외부 파운드리</text><text x="180" y="253" text-anchor="middle" font-size="14" fill="#425d70" font-weight="500">웨이퍼 제조</text><line x1="180" y1="278" x2="180" y2="307" stroke="#076171" stroke-width="2" marker-end="url(#arrow-cyan)"/><rect x="45" y="318" width="270" height="64" rx="6" fill="#e3f2e9" stroke="#adc6d3" stroke-width="1.5"/><text x="180" y="345" text-anchor="middle" font-size="16" fill="#18394f" font-weight="700">패키징·테스트 파트너</text><text x="180" y="367" text-anchor="middle" font-size="14" fill="#425d70" font-weight="500">연결·검사</text><text x="180" y="410" text-anchor="middle" font-size="14" fill="#425d70" font-weight="500">역할 분담과 제조 조건의 협업</text></g></svg>
