<svg xmlns="http://www.w3.org/2000/svg" width="360" height="420" viewBox="0 0 360 420" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">열산화 전후와 원래 표면</title><desc id="diagram-desc">실리콘이 산화막으로 변하며 원래 실리콘 표면 점선의 위와 아래에 산화막이 형성되는 전후 단면。열산화 예시이며 성장 비율·온도·시간을 수치로 표현하지 않았습니다.</desc><defs><marker id="arrow-ink" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#18394f"/></marker><marker id="arrow-cyan" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#076171"/></marker><marker id="arrow-amber" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#8b471b"/></marker></defs><rect width="360" height="420" fill="#f7fbfc"/><g font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif"><text x="180" y="29" text-anchor="middle" font-size="16" fill="#18394f" font-weight="700">① 산화 전</text><rect x="30" y="67" width="300" height="67" rx="2" fill="#dfe8ed" stroke="#adc6d3" stroke-width="1.5"/><text x="180" y="105.5" text-anchor="middle" font-size="15" fill="#18394f" font-weight="500">실리콘</text><line x1="30" y1="67" x2="330" y2="67" stroke="#8b471b" stroke-width="2" stroke-dasharray="5 4"/><text x="180" y="165" text-anchor="middle" font-size="15" fill="#076171" font-weight="500">산소·수증기 등의 분위기</text><line x1="127" y1="176" x2="127" y2="206" stroke="#076171" stroke-width="2" marker-end="url(#arrow-cyan)"/><line x1="233" y1="176" x2="233" y2="206" stroke="#076171" stroke-width="2" marker-end="url(#arrow-cyan)"/><text x="180" y="237" text-anchor="middle" font-size="16" fill="#18394f" font-weight="700">② 열산화 후</text><rect x="30" y="275" width="300" height="63" rx="1" fill="#f5d5ad" stroke="#8b471b" stroke-width="1.5"/><rect x="30" y="338" width="300" height="61" rx="1" fill="#dfe8ed" stroke="#adc6d3" stroke-width="1.5"/><line x1="20" y1="307" x2="340" y2="307" stroke="#18394f" stroke-width="1.5" stroke-dasharray="5 4"/><text x="180" y="296" text-anchor="middle" font-size="16" fill="#8b471b" font-weight="700">산화막 SiO₂</text><text x="180" y="330" text-anchor="middle" font-size="14" fill="#18394f" font-weight="500">점선: 원래 실리콘 표면</text><text x="180" y="374" text-anchor="middle" font-size="15" fill="#18394f" font-weight="500">일부 실리콘이 소비됨</text><path d="M20 308 V66 H29" fill="none" stroke="#425d70" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 5"/></g></svg>
