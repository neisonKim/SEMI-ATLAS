<svg xmlns="http://www.w3.org/2000/svg" width="360" height="420" viewBox="0 0 360 420" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">명령 가져오기·실행·다음 명령</title><desc id="diagram-desc">메모리에서 명령과 데이터를 가져와 해석·실행하고 결과와 다음 명령으로 이어지는 CPU의 개념적 실행 흐름。실제 파이프라인의 단계 수나 실행 순서 전체를 나타내지 않습니다.</desc><defs><marker id="arrow-ink" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#18394f"/></marker><marker id="arrow-cyan" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#076171"/></marker><marker id="arrow-amber" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#8b471b"/></marker></defs><rect width="360" height="420" fill="#f7fbfc"/><g font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif"><rect x="75" y="20" width="240" height="66" rx="6" fill="#d9f1f3" stroke="#adc6d3" stroke-width="1.5"/><text x="195" y="47" text-anchor="middle" font-size="16" fill="#18394f" font-weight="700">캐시·메모리</text><text x="195" y="69" text-anchor="middle" font-size="14" fill="#425d70" font-weight="500">명령과 데이터를 공급</text><line x1="195" y1="93" x2="195" y2="121" stroke="#076171" stroke-width="2" marker-end="url(#arrow-cyan)"/><rect x="65" y="130" width="260" height="206" rx="6" fill="#ffffff" stroke="#adc6d3" stroke-width="1.5"/><text x="195" y="154" text-anchor="middle" font-size="15" fill="#18394f" font-weight="700">CPU의 개념적 실행</text><rect x="100" y="170" width="190" height="40" rx="6" fill="#d9f1f3" stroke="#adc6d3" stroke-width="1.5"/><text x="195" y="196" text-anchor="middle" font-size="16" fill="#18394f" font-weight="700">가져오기</text><line x1="195" y1="215" x2="195" y2="234" stroke="#076171" stroke-width="2" marker-end="url(#arrow-cyan)"/><rect x="100" y="242" width="190" height="40" rx="6" fill="#d9f1f3" stroke="#adc6d3" stroke-width="1.5"/><text x="195" y="268" text-anchor="middle" font-size="16" fill="#18394f" font-weight="700">해석·실행</text><line x1="195" y1="289" x2="195" y2="337" stroke="#076171" stroke-width="2" marker-end="url(#arrow-cyan)"/><rect x="75" y="344" width="240" height="55" rx="6" fill="#d9f1f3" stroke="#adc6d3" stroke-width="1.5"/><text x="195" y="377.5" text-anchor="middle" font-size="16" fill="#18394f" font-weight="700">결과·다음 명령</text><path d="M72 371 H32 V54 H68" fill="none" stroke="#076171" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-cyan)"/><text x="37" y="250" text-anchor="middle" font-size="14" fill="#076171" font-weight="500">반복</text></g></svg>
