<svg xmlns="http://www.w3.org/2000/svg" width="360" height="420" viewBox="0 0 360 420" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">다이 보호·전기 연결·방열 경로</title><desc id="diagram-desc">보호 구조 안의 다이가 와이어와 기판으로 연결되고 전기 경로와 열 방출 경로가 구분되는 패키지 단면。와이어 본딩 패키지의 예시이며 모든 패키지의 공통 단면은 아닙니다.</desc><defs><marker id="arrow-ink" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#18394f"/></marker><marker id="arrow-cyan" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#076171"/></marker><marker id="arrow-amber" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#8b471b"/></marker></defs><rect width="360" height="420" fill="#f7fbfc"/><g font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif"><text x="180" y="27" text-anchor="middle" font-size="16" fill="#18394f" font-weight="700">와이어 본딩 패키지 예시</text><rect x="26" y="120" width="308" height="180" rx="19" fill="#e3f2e9" stroke="#adc6d3" stroke-width="1.5"/><rect x="47" y="256" width="266" height="44" rx="2" fill="#b9d7e8" stroke="#076171" stroke-width="1.5"/><line x1="129" y1="202" x2="129" y2="209" stroke="#18394f" stroke-width="2"/><line x1="129" y1="249" x2="129" y2="256" stroke="#18394f" stroke-width="2"/><line x1="154.5" y1="202" x2="154.5" y2="209" stroke="#18394f" stroke-width="2"/><line x1="154.5" y1="249" x2="154.5" y2="256" stroke="#18394f" stroke-width="2"/><line x1="180" y1="202" x2="180" y2="209" stroke="#18394f" stroke-width="2"/><line x1="180" y1="249" x2="180" y2="256" stroke="#18394f" stroke-width="2"/><line x1="205.5" y1="202" x2="205.5" y2="209" stroke="#18394f" stroke-width="2"/><line x1="205.5" y1="249" x2="205.5" y2="256" stroke="#18394f" stroke-width="2"/><li