<svg xmlns="http://www.w3.org/2000/svg" width="360" height="420" viewBox="0 0 360 420" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">계측과 검사에서 공정 피드백까지</title><desc id="diagram-desc">웨이퍼의 두 층 정렬을 계측하는 경로와 결함 후보 위치를 검사하는 경로가 공정 피드백으로 합쳐지는 관계도。검출 결과를 공정에 돌려주는 흐름만 그렸습니다. 실제 계측 표식과 검사 장비는 생략했습니다.</desc><defs><marker id="arrow-ink" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#18394f"/></marker><marker id="arrow-cyan" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#076171"/></marker><marker id="arrow-amber" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#8b471b"/></marker></defs><rect width="360" height="420" fill="#f7fbfc"/><g font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif"><rect x="75" y="23" width="210" height="51" rx="6" fill="#d9f1f3" stroke="#adc6d3" stroke-width="1.5"/><text x="180" y="54.5" text-anchor="middle" font-size="16" fill="#18394f" font-weight="700">가공한 웨이퍼</text><path d="M180 80 V107 H89 V128" fill="none" stroke="#076171" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-cyan)"/><path d="M180 107 H271 V128" fill="none" stroke="#076171" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-cyan)"/><rect x="15" y="137" width="148" height="118" rx="6" fill="#d9f1f3" stroke="#adc6d3" stroke-width="1.5"/><text x="89" y="202" text-anchor="middle" font-size="16" fill="#18394f" font-weight="700">계측</text><rect x="197" y="137" width="148" height="118" rx="6" fill="#f5d5ad" stroke="#adc6d3" stroke-width="1.5"/><text x="271" y="202" text-anchor="middle" font-size="16" fill="#18394f" font-weight="700">결함 검사</text><rect x="57" y="198" width="57" height="17" rx="1" fill="#b9d7e8" stroke="#076171" stroke-width="1.5"/><rect x="68" y="205" width="57" height="17" rx="1" fill="none" stroke="#8b471b" stroke-width="1.5"/><circle cx="272" cy="209" r="20" fill="#ffffff"/><circle cx="263" cy="211" r="4" fill="#8b471b"/><circle cx="279" cy="201" r="4" fill="#8b471b"/><path d="M89 262 V293 H180 V321" fill="none" stroke="#076171" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-cyan)"/><path d="M271 262 V293 H180" fill="none" stroke="#076171" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="77" y="330" width="206" height="61" rx="6" fill="#d9f1f3" stroke="#adc6d3" stroke-width="1.5"/><text x="180" y="357" text-anchor="middle" font-size="16" fill="#18394f" font-weight="700">공정 피드백</text><text x="180" y="379" text-anchor="middle" font-size="14" fill="#425d70" font-weight="500">치수 추세와 위치 분석</text></g></svg>
