<svg xmlns="http://www.w3.org/2000/svg" width="360" height="420" viewBox="0 0 360 420" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">재료 → 소자 → 회로</title><desc id="diagram-desc">실리콘 재료 위에 전류 제어 소자를 만들고 배선으로 연결해 회로를 구성하는 관계。학습 개념의 연결이며 실제 제조 순서 전체를 나타내지 않습니다.</desc><defs><marker id="arrow-ink" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#18394f"/></marker><marker id="arrow-cyan" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#076171"/></marker><marker id="arrow-amber" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#8b471b"/></marker></defs><rect width="360" height="420" fill="#f7fbfc"/><g font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif"><rect x="70" y="20" width="220" height="90" rx="6" fill="#d9f1f3" stroke="#adc6d3" stroke-width="1.5"/><text x="180" y="47" text-anchor="middle" font-size="16" fill="#18394f" font-weight="700">반도체 재료</text><text x="180" y="69" text-anchor="middle" font-size="14" fill="#425d70" font-weight="500">전기적 성질을 조절</text><circle cx="105" cy="83" r="2.5" fill="#076171"/><circle cx="135" cy="83" r="2.5" fill="#076171"/><circle cx="165" cy="83" r="2.5" fill="#076171"/><circle cx="195" cy="83" r="2.5" fill="#076171"/><circle cx="225" cy="83" r="2.5" fill="#076171"/><circle cx="255" cy="83" r="2.5" fill="#076171"/><circle cx="105" cy="95" r="2.5" fill="#076171"/><circle cx="135" cy="95" r="2.5" fill="#076171"/><circle cx="165" cy="95" r="2.5" fill="#076171"/><circle cx="195" cy="95" r="2.5" fill="#076171"/><circle cx="225" cy="95" r="2.5" fill="#076171"/><circle cx="255" cy="95" r="2.5" fill="#076171"/><line x1="180" y1="115" x2="180" y2="149" stroke="#076171" stroke-width="2" marker-end="url(#arrow-cyan)"/><rect x="70" y="160" width="220" height="100" rx="6" fill="#ffffff" stroke="#adc6d3" stroke-width="1.5"/><text x="180" y="184" text-anchor="middle" font-size="16" fill="#18394f" font-weight="700">전류 제어 소자</text><line x1="34" y1="218" x2="108" y2="218" stroke="#076171" stroke-width="2" marker-end="url(#arrow-cyan)"/><text x="43" y="199" text-anchor="middle" font-size="14" fill="#18394f" font-weight="500">입력</text><line x1="116" y1="215" x2="154" y2="215" stroke="#18394f" stroke-width="2"/><line x1="154" y1="207" x2="154" y2="226" stroke="#8b471b" stroke-width="3"/><line x1="165" y1="215" x2="236" y2="215" stroke="#18394f" stroke-width="2"/><line x1="239" y1="215" x2="315" y2="215" stroke="#076171" stroke-width="2" marker-end="url(#arrow-cyan)"/><text x="302" y="195" text-anchor="middle" font-size="14" fill="#18394f" font-weight="500">출력</text><line x1="180" y1="268" x2="180" y2="303" stroke="#076171" stroke-width="2" marker-end="url(#arrow-cyan)"/><line x1="102" y1="311" x2="102" y2="318" stroke="#18394f" stroke-width="2"/><line x1="102" y1="386" x2="102" y2="393" stroke="#18394f" stroke-width="2"/><line x1="141" y1="311" x2="141" y2="318" stroke="#18394f" stroke-width="2"/><line x1="141" y1="386" x2="141" y2="393" stroke="#18394f" stroke-width="2"/><line x1="180" y1="311" x2="180" y2="318" stroke="#18394f" stroke-width="2"/><line x1="180" y1="386" x2="180" y2="393" stroke="#18394f" stroke-width="2"/><line x1="219" y1="311" x2="219" y2="318" stroke="#18394f" stroke-width="2"/><line x1="219" y1="386" x2="219" y2="393" stroke="#18394f" stroke-width="2"/><line x1="258" y1="311" x2="258" y2="318" stroke="#18394f" stroke-width="2"/><line x1="258" y1="386" x2="258" y2="393" stroke="#18394f" stroke-width="2"/><rect x="90" y="318" width="180" height="68" rx="4" fill="#b9d7e8" stroke="#076171" stroke-width="1.5"/><text x="180" y="357" text-anchor="middle" font-size="15" fill="#18394f" font-weight="700">연결된 회로</text><text x="180" y="409" text