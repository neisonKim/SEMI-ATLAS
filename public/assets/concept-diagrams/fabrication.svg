<svg xmlns="http://www.w3.org/2000/svg" width="360" height="450" viewBox="0 0 360 450" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">제조공정의 반복과 점검</title><desc id="diagram-desc">막 형성·노광·식각·세정의 반복과 검사·계측의 연결을 나타낸 제조공정 지도。전체 공정 순서표나 제조 레시피가 아니며 단계 수·횟수는 제품마다 다릅니다.</desc><defs><marker id="arrow-ink" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#18394f"/></marker><marker id="arrow-cyan" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#076171"/></marker><marker id="arrow-amber" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#8b471b"/></marker></defs><rect width="360" height="450" fill="#f7fbfc"/><g font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif"><rect x="22" y="33" width="140" height="70" rx="6" fill="#d9f1f3" stroke="#adc6d3" stroke-width="1.5"/><text x="92" y="60" text-anchor="middle" font-size="16" fill="#18394f" font-weight="700">막 형성</text><text x="92" y="82" text-anchor="middle" font-size="14" fill="#425d70" font-weight="500">재료 쌓기</text><rect x="198" y="135" width="140" height="70" rx="6" fill="#d9f1f3" stroke="#adc6d3" stroke-width="1.5"/><text x="268" y="162" text-anchor="middle" font-size="16" fill="#18394f" font-weight="700">노광</text><text x="268" y="184" text-anchor="middle" font-size="14" fill="#425d70" font-weight="500">패턴 정의</text><rect x="198" y="324" width="140" height="70" rx="6" fill="#d9f1f3" stroke="#adc6d3" stroke-width="1.5"/><text x="268" y="351" text-anchor="middle" font-size="16" fill="#18394f" font-weight="700">식각</text><text x="268" y="373" text-anchor="middle" font-size="14" fill="#425d70" font-weight="500">선택적 제거</text><rect x="22" y="324" width="140" height="70" rx="6" fill="#d9f1f3" stroke="#adc6d3" stroke-width="1.5"/><text x="92" y="351" text-anchor="middle" font-size="16" fill="#18394f" font-weight="700">세정</text><text x="92" y="373" text-anchor="middle" font-size="14" fill="#425d70" font-weight="500">오염 저감</text><rect x="22" y="135" width="140" height="70" rx="6" fill="#f5d5ad" stroke="#adc6d3" stroke-width="1.5"/><text x="92" y="162" text-anchor="middle" font-size="16" fill="#18394f" font-weight="700">검사·계측</text><text x="92" y="184" text-anchor="middle" font-size="14" fill="#425d70" font-weight="500">상태 확인</text><path d="M164 67 H268 V125" fill="none" stroke="#076171" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-cyan)"/><line x1="268" y1="213" x2="268" y2="313" stroke="#076171" stroke-width="2" marker-end="url(#arrow-cyan)"/><line x1="189" y1="359" x2="171" y2="359" stroke="#076171" stroke-width="2" marker-end="url(#arrow-cyan)"/><path d="M91 313 V214" fill="none" stroke="#076171" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-cyan)"/><path d="M91 126 V112" fill="none" stroke="#076171" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-cyan)"/><path d="M163 170 H188 V286 H198" fill="none" stroke="#425d70" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><text x="180" y="250" text-anchor="middle" font-size="15" fill="#076171" font-weight="700">층·구조에 맞춰 반복</text><text x="180" y="426" text-anchor="middle" font-size="14" fill="#425d70" font-weight="500">이온주입·열처리·CMP 등도 조합</text></g></svg>
