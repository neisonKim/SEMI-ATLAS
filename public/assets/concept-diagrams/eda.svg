<svg xmlns="http://www.w3.org/2000/svg" width="360" height="420" viewBox="0 0 360 420" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">동작 표현에서 검증된 레이아웃으로</title><desc id="diagram-desc">RTL과 설계 제약이 논리 합성, 물리 배치 배선과 검증을 거쳐 레이아웃으로 이어지는 흐름。디지털 구현의 핵심 단계만 그렸습니다. 검증 결과에 따라 이전 단계로 되돌아갈 수 있습니다.</desc><defs><marker id="arrow-ink" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#18394f"/></marker><marker id="arrow-cyan" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#076171"/></marker><marker id="arrow-amber" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#8b471b"/></marker></defs><rect width="360" height="420" fill="#f7fbfc"/><g font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif"><rect x="50" y="20" width="260" height="63" rx="6" fill="#d9f1f3" stroke="#adc6d3" stroke-width="1.5"/><text x="180" y="47" text-anchor="middle" font-size="16" fill="#18394f" font-weight="700">RTL과 설계 제약</text><text x="180" y="69" text-anchor="middle" font-size="14" fill="#425d70" font-weight="500">동작·목표 클록</text><line x1="180" y1="90" x2="180" y2="116" stroke="#076171" stroke-width="2" marker-end="url(#arrow-cyan)"/><rect x="50" y="126" width="260" height="63" rx="6" fill="#d9f1f3" stroke="#adc6d3" stroke-width="1.5"/><text x="180" y="153" text-anchor="middle" font-size="16" fill="#18394f" font-weight="700">논리 합성</text><text x="180" y="175" text-anchor="middle" font-size="14" fill="#425d70" font-weight="500">셀과 연결 정보</text><line x1="180" y1="196" x2="180" y2="222" stroke="#076171" stroke-width="2" marker-end="url(#arrow-cyan)"/><rect x="50" y="232" width="260" height="63" rx="6" fill="#d9f1f3" stroke="#adc6d3" stroke-width="1.5"/><text x="180" y="259" text-anchor="middle" font-size="16" fill="#18394f" font-weight="700">물리 배치·배선</text><text x="180" y="281" text-anchor="middle" font-size="14" fill="#425d70" font-weight="500">셀 위치와 연결 경로</text><line x1="180" y1="302" x2="180" y2="328" stroke="#076171" stroke-width="2" marker-end="url(#arrow-cyan)"/><rect x="50" y="338" width="260" height="64" rx="6" fill="#f5d5ad" stroke="#adc6d3" stroke-width="1.5"/><text x="180" y="365" text-anchor="middle" font-size="16" fill="#18394f" font-weight="700">검증과 레이아웃</text><text x="180" y="387" text-anchor="middle" font-size="14" fill="#425d70" font-weight="500">타이밍·제조 규칙 점검</text></g></svg>
