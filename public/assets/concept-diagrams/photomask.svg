<svg xmlns="http://www.w3.org/2000/svg" width="360" height="420" viewBox="0 0 360 420" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">마스크에서 감광막으로의 패턴 전달</title><desc id="diagram-desc">레티클의 패턴 정보를 광학계가 축소하여 웨이퍼 감광막에 투영하는 관계도。투과·반사 광선 경로를 공통 단계로 요약했습니다. 개별 장비의 광학 배치는 다릅니다.</desc><defs><marker id="arrow-ink" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#18394f"/></marker><marker id="arrow-cyan" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#076171"/></marker><marker id="arrow-amber" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#8b471b"/></marker></defs><rect width="360" height="420" fill="#f7fbfc"/><g font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif"><text x="180" y="34" text-anchor="middle" font-size="16" fill="#18394f" font-weight="700">레티클 패턴</text><rect x="58" y="59" width="244" height="35" rx="3" fill="#b9d7e8" stroke="#076171" stroke-width="1.5"/><rect x="89" y="65" width="35" height="23" rx="1" fill="#18394f" stroke="#18394f" stroke-width="1.5"/><rect x="159" y="65" width="35" height="23" rx="1" fill="#18394f" stroke="#18394f" stroke-width="1.5"/><rect x="229" y="65" width="35" height="23" rx="1" fill="#18394f" stroke="#18394f" stroke-width="1.5"/><line x1="180" y1="102" x2="180" y2="134" stroke="#076171" stroke-width="2" marker-end="url(#arrow-cyan)"/><rect x="72" y="145" width="216" height="68" rx="6" fill="#d9f1f3" stroke="#adc6d3" stroke-width="1.5"/><text x="180" y="172" text-anchor="middle" font-size="16" fill="#18394f" font-weight="700">노광 광학계</text><text x="180" y="194" text-anchor="middle" font-size="14" fill="#425d70" font-weight="500">패턴 이미지 축소</text><line x1="180" y1="220" x2="180" y2="267" stroke="#076171" stroke-width="2" marker-end="url(#arrow-cyan)"/><rect x="48" y="293" width="264" height="30" rx="2" fill="#f5d5ad" stroke="#8b471b" stroke-width="1.5"/><rect x="48" y="323" width="264" height="38" rx="2" fill="#dfe8ed" stroke="#adc6d3" stroke-width="1.5"/><rect x="135" y="297" width="18" height="10" rx="0" fill="#8b471b" stroke="#8b471b" stroke-width="1.5"/><rect x="169" y="297" width="18" height="10" rx="0" fill="#8b471b" stroke="#8b471b" stroke-width="1.5"/><rect x="203" y="297" width="18" height="10" rx="0" fill="#8b471b" stroke="#8b471b" stroke-width="1.5"/><text x="180" y="389" text-anchor="middle" font-size="15" fill="#18394f" font-weight="700">웨이퍼 위 감광막</text></g></svg>
