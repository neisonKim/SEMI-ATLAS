<svg xmlns="http://www.w3.org/2000/svg" width="360" height="420" viewBox="0 0 360 420" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">전달·분리·제어의 세 역할</title><desc id="diagram-desc">도체의 전류 경로, 절연체의 분리 경로, 제어 입력이 있는 반도체 경로를 나란히 비교。저항이나 전류 크기를 수치로 비교한 그래프가 아닙니다.</desc><defs><marker id="arrow-ink" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#18394f"/></marker><marker id="arrow-cyan" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#076171"/></marker><marker id="arrow-amber" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#8b471b"/></marker></defs><rect width="360" height="420" fill="#f7fbfc"/><g font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif"><rect x="20" y="40" width="320" height="96" rx="6" fill="#ffffff" stroke="#adc6d3" stroke-width="1.5"/><text x="48" y="65" text-anchor="start" font-size="16" fill="#18394f" font-weight="700">도체</text><line x1="47" y1="102" x2="108" y2="102" stroke="#076171" stroke-width="2" marker-end="url(#arrow-cyan)"/><path d="M110 102 l10 -9 l12 18 l12 -18 l12 18 l12 -18 l10 9" fill="none" stroke="#18394f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><line x1="181" y1="102" x2="306" y2="102" stroke="#076171" stroke-width="2" marker-end="url(#arrow-cyan)"/><text x="259" y="68" text-anchor="middle" font-size="14" fill="#076171" font-weight="500">전달 경로</text><rect x="20" y="163" width="320" height="96" rx="6" fill="#ffffff" stroke="#adc6d3" stroke-width="1.5"/><text x="48" y="188" text-anchor="start" font-size="16" fill="#18394f" font-weight="700">절연체</text><line x1="47" y1="225" x2="146" y2="225" stroke="#18394f" stroke-width="2"/><rect x="147" y="202" 