<svg xmlns="http://www.w3.org/2000/svg" width="360" height="420" viewBox="0 0 360 420" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">배선층과 층간 비아</title><desc id="diagram-desc">절연막 위아래의 수평 금속선 두 개가 지정된 한 지점의 비아를 통해 연결되는 단면。배선 단면을 설명하기 위해 방지막과 미세 공정 치수는 생략했습니다.</desc><defs><marker id="arrow-ink" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#18394f"/></marker><marker id="arrow-cyan" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#076171"/></marker><marker id="arrow-amber" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#8b471b"/></marker></defs><rect width="360" height="420" fill="#f7fbfc"/><g font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif"><text x="180" y="36" text-anchor="middle" font-size="17" fill="#18394f" font-weight="700">두 층을 잇는 금속 배선</text><rect x="35" y="70" width="290" height="255" rx="3" fill="#dfe8ed" stroke="#adc6d3" stroke-width="1.5"/><rect x="60" y="124" width="149" height="26" rx="2" fill="#b9d7e8" stroke="#076171" stroke-width="1.5"/><rect x="177" y="150" width="28" height="85" rx="0" fill="#f5d5ad" stroke="#8b471b" stroke-width="1.5"/><rect x="173" y="235" width="126" height="26" rx="2" fill="#b9d7e8" stroke="#076171" stroke-width="1.5"/><text x="118" y="108" text-anchor="middle" font-size="15" fill="#076171" font-weight="500">상부 금속선</text><text x="244" y="287" text-anchor="middle" font-size="15" fill="#076171" font-weight="500">하부 금속선</text><line x1="205" y1="191" x2="239" y2="191" stroke="#8b471b" stroke-width="2"/><text x="263" y="196" text-anchor="middle" font-size="15" fill="#8b471b" font-weight="500">비아</text><text x="105" y="223" text-anchor="middle" font-size="15" fill="#18394f" font-weight="500">층간 절연막</text><text x="180" y="377" text-anchor="middle" font-size="15" fill="#425d70" font-weight="500">지정된 지점에서만 층간 연결</text></g></svg>
