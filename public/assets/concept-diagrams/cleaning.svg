<svg xmlns="http://www.w3.org/2000/svg" width="360" height="420" viewBox="0 0 360 420" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">표면 오염의 저감과 재오염 관리</title><desc id="diagram-desc">기판 표면의 입자와 잔여물이 세정을 통해 줄어들고 표면 손상과 재오염을 함께 관리하는 모습。오염 저감 목표이며 제거율이나 무오염 상태를 보증하는 그림이 아닙니다.</desc><defs><marker id="arrow-ink" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#18394f"/></marker><marker id="arrow-cyan" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#076171"/></marker><marker id="arrow-amber" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#8b471b"/></marker></defs><rect width="360" height="420" fill="#f7fbfc"/><g font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif"><text x="180" y="28" text-anchor="middle" font-size="16" fill="#18394f" font-weight="700">① 입자·유기물·금속 오염 등</text><rect x="30" y="106" width="300" height="51" rx="2" fill="#dfe8ed" stroke="#adc6d3" stroke-width="1.5"/><text x="180" y="136.5" text-anchor="middle" font-size="15" fill="#18394f" font-weight="500">표면·재료</text><circle cx="64" cy="101" r="6" fill="#8b471b"/><circle cx="128" cy="101" r="6" fill="#8b471b"/><circle cx="243" cy="101" r="6" fill="#8b471b"/><circle cx="287" cy="101" r="6" fill="#8b471b"/><path d="M170 106 Q174 82 195 91 Q218 85 221 106 Z" fill="#f5d5ad" stroke="#8b471b" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><line x1="180" y1="176" x2="180" y2="211" stroke="#076171" stroke-width="2" marker-end="url(#arrow-cyan)"/><text x="180" y="241" text-anchor="middle" font-size="16" fill="#18394f" font-weight="700">② 오염 종류에 맞는 세정</text><path d="M91 257 q-14 19 0 24 q14 -5 0 -24 Z" fill="#d9f1f3" stroke="#076171" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><path d="M180 257 q-14 19 0 24 q14 -5 0 -24 Z" fill="#d9f1f3" stroke="#076171" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><path d="M269 257 q-14 19 0 24 q14 -5 0 -24 Z" fill="#d9f1f3" stroke="#076171" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><rect x="30" y="308" width="300" height="58" rx="2" fill="#dfe8ed" stroke="#adc6d3" stroke-width="1.5"/><text x="180" y="342" text-anchor="middle" font-size="15" fill="#18394f" font-weight="500">손상·잔여물·재오염도 관리</text><circle cx="289" cy="304" r="2" fill="#8b471b"/><text x="180" y="407" text-anchor="middle" font-size="14" fill="#425d70" font-weight="500">오염 저감 목표 ≠ 오염 0 보증</text></g></svg>
