<svg xmlns="http://www.w3.org/2000/svg" width="360" height="420" viewBox="0 0 360 420" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">평면 nMOS의 단면과 전류 제어</title><desc id="diagram-desc">p형 바디의 n형 소스와 드레인 사이 채널 위에 절연막과 게이트가 있으며 전기장이 채널을 제어하는 평면 nMOS 단면。켜진 nMOS의 예시이며 게이트 누설·접합·공핍층의 상세 형상은 생략했습니다.</desc><defs><marker id="arrow-ink" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#18394f"/></marker><marker id="arrow-cyan" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#076171"/></marker><marker id="arrow-amber" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#8b471b"/></marker></defs><rect width="360" height="420" fill="#f7fbfc"/><g font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif"><text x="180" y="28" text-anchor="middle" font-size="16" fill="#18394f" font-weight="700">켜진 평면 nMOS의 단순화</text><rect x="30" y="198" width="300" height="119" rx="2" fill="#dfe8ed" stroke="#adc6d3" stroke-width="1.5"/><rect x="53" y="198" width="72" height="42" rx="1" fill="#b9d7e8" stroke="#076171" stroke-width="1.5"/><rect x="235" y="198" width="72" height="42" rx="1" fill="#b9d7e8" stroke="#076171" stroke-width="1.5"/><rect x="126" y="190" width="108" height="8" rx="0" fill="#f5d5ad" stroke="#8b471b" stroke-width="1.5"/><rect x="133" y="148" width="94" height="42" rx="2" fill="#076171" stroke="#076171" stroke-width="1.5"/><line x1="89" y1="198" x2="89" y2="136" stroke="#18394f" stroke-width="2"/><line x1="271" y1="198" x2="271" y2="136" stroke="#18394f" stroke-width="2"/><line x1="180" y1="153" x2="180" y2="93" stroke="#18394f" stroke-width="2"/><text x="89" y="121" text-anchor="middle" font-size="15" fill="#18394f" font-weight="700">소스 S</text><text x="271" y="121" text-anchor="middle" font-size="15" fill="#18394f" font-weight="700">드레인 D</text><text x="180" y="78" text-anchor="middle" font-size="15" fill="#18394f" font-weight="700">게이트 G</text><text x="89" y="224" text-anchor="middle" font-size="15" fill="#18394f" font-weight="500">n+</text><text x="271" y="224" text-anchor="middle" font-size="15" fill="#18394f" font-weight="500">n+</text><text x="180" y="295" text-anchor="middle" font-size="16" fill="#18394f" font-weight="500">p형 바디</text><line x1="125" y1="205" x2="235" y2="205" stroke="#076171" stroke-width="5"/><line x1="168" y1="190" x2="168" y2="211" stroke="#8b471b" stroke-width="1.5" marker-end="url(#arrow-amber)"/><line x1="193" y1="190" x2="193" y2="211" stroke="#8b471b" stroke-width="1.5" marker-end="url(#arrow-amber)"/><path d="M233 193 H317 V169" fill="none" stroke="#8b471b" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" /><text x="314" y="158" text-anchor="middle" font-size="14" fill="#8b471b" font-weight="500">절연막</text><path d="M181 208 V253" fill="none" stroke="#076171" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" /><text x="180" y="272" text-anchor="middle" font-size="15" fill="#076171" font-weight="500">채널</text><line x1="265" y1="346" x2="95" y2="346" stroke="#076171" stroke-width="2" marker-end="url(#arrow-cyan)"/><text x="180" y="372" text-anchor="middle" font-size="15" fill="#076171" font-weight="500">관례적 전류 방향 D → S</text><text x="180" y="404" text-anchor="middle" font-size="15" fill="#425d70" font-weight="500">게이트 전기장이 채널을 제어</text></g></svg>
