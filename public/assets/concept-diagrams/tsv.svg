<svg xmlns="http://www.w3.org/2000/svg" width="360" height="420" viewBox="0 0 360 420" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">도체·절연층·실리콘·접합부</title><desc id="diagram-desc">실리콘을 관통하는 도체 둘레에 절연층이 있고 위아래 표면 배선과 접합부로 연결되는 TSV 단면。배리어·라이너 등의 세부 층과 실제 치수를 생략했습니다.</desc><defs><marker id="arrow-ink" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#18394f"/></marker><marker id="arrow-cyan" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#076171"/></marker><marker id="arrow-amber" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#8b471b"/></marker></defs><rect width="360" height="420" fill="#f7fbfc"/><g font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif"><text x="180" y="28" text-anchor="middle" font-size="17" fill="#18394f" font-weight="700">실리콘을 관통하는 연결</text><rect x="34" y="120" width="292" height="174" rx="1" fill="#dfe8ed" stroke="#adc6d3" stroke-width="1.5"/><rect x="157" y="118" width="46" height="178" rx="1" fill="#d9f1f3" stroke="#076171" stroke-width="1.5"/><rect x="166" y="118" width="28" height="178" rx="1" fill="#f5d5ad" stroke="#8b471b" stroke-width="1.5"/><line x1="180" y1="119" x2="180" y2="83" stroke="#8b471b" stroke-width="4"/><line x1="102" y1="83" x2="180" y2="83" stroke="#8b471b" stroke-width="4"/><line x1="180" y1="296" x2="180" y2="333" stroke="#8b471b" stroke-width="4"/><rect x="162" y="331" width="36" height="13" rx="3" fill="#f5d5ad" stroke="#8b471b" stroke-width="1.5"/><rect x="90" y="351" width="180" height="43" rx="6" fill="#b9d7e8" stroke="#adc6d3" stroke-width="1.5"/><text x="180" y="378.5" text-anchor="middle" font-size="16" fill="#18394f" font-weight="700">다른 연결부·다이</text><text x="76" y="182" text-anchor="middle" font-size="15" fill="#18394f" font-weight="500">실리콘</text><path d="M200 162 H272 V145" fill="none" stroke="#076171" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" /><text x="277" y="132" text-anchor="middle" font-size="14" fill="#076171" font-weight="500">절연층</text><path d="M184 223 H271 V247" fill="none" stroke="#8b471b" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" /><text x="276" y="269" text-anchor="middle" font-size="14" fill="#8b471b" font-weight="500">도체</text><text x="92" y="62" text-anchor="middle" font-size="14" fill="#8b471b" font-weight="500">표면 배선</text><text x="263" y="339" text-anchor="middle" font-size="14" fill="#8b471b" font-weight="500">접합부</text><text x="180" y="415" text-anchor="middle" font-size="14" fill="#425d70" font-weight="500">표면 배선과 접합도 함께 필요</text></g></svg>
