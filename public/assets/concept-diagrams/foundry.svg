<svg xmlns="http://www.w3.org/2000/svg" width="360" height="420" viewBox="0 0 360 420" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">설계 입력에서 웨이퍼 제조까지</title><desc id="diagram-desc">고객의 회로 설계를 공정 설계 규칙과 맞추고 제조·검사 과정을 거쳐 웨이퍼와 후속 공정으로 연결하는 흐름。실제 공정 순서나 제조사의 계약·생산 지표 계산식 전체를 나타내지 않습니다.</desc><defs><marker id="arrow-ink" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#18394f"/></marker><marker id="arrow-cyan" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#076171"/></marker><marker id="arrow-amber" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#8b471b"/></marker></defs><rect width="360" height="420" fill="#f7fbfc"/><g font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif"><rect x="53" y="18" width="254" height="64" rx="6" fill="#d9f1f3" stroke="#adc6d3" stroke-width="1.5"/><text x="180" y="45" text-anchor="middle" font-size="16" fill="#18394f" font-weight="700">고객의 회로 설계</text><text x="180" y="67" text-anchor="middle" font-size="14" fill="#425d70" font-weight="500">목표 기능과 레이아웃</text><line x1="180" y1="89" x2="180" y2="114" stroke="#076171" stroke-width="2" marker-end="url(#arrow-cyan)"/><rect x="53" y="124" width="254" height="64" rx="6" fill="#f5d5ad" stroke="#adc6d3" stroke-width="1.5"/><text x="180" y="151" text-anchor="middle" font-size="16" fill="#18394f" font-weight="700">설계 규칙·공정 협업</text><text x="180" y="173" text-anchor="middle" font-size="14" fill="#425d70" font-weight="500">만들 수 있는 설계인지 확인</text><line x1="180" y1="196" x2="180" y2="219" stroke="#076171" stroke-width="2" marker-end="url(#arrow-cyan)"/><rect x="53" y="230" width="254" height="94" rx="6" fill="#ffffff" stroke="#076171" stroke-width="1.5"/><text x="180" y="256" text-anchor="middle" font-size="16" fill="#18394f" font-weight="700">웨이퍼 제조·검사</text><rect x="78" y="273" width="30" height="24" rx="2" fill="#d9f1f3" stroke="#076171" stroke-width="1.5"/><rect x="120" y="273" width="30" height="24" rx="2" fill="#d9f1f3" stroke="#076171" stroke-width="1.5"/><rect x="162" y="273" width="30" height="24" rx="2" fill="#d9f1f3" stroke="#076171" stroke-width="1.5"/><rect x="204" y="273" width="30" height="24" rx="2" fill="#d9f1f3" stroke="#076171" stroke-width="1.5"/><rect x="246" y="273" width="30" height="24" rx="2" fill="#d9f1f3" stroke="#076171" stroke-width="1.5"/><line x1="180" y1="331" x2="180" y2="353" stroke="#076171" stroke-width="2" marker-end="url(#arrow-cyan)"/><rect x="35" y="364" width="290" height="41" rx="6" fill="#d9f1f3" stroke="#adc6d3" stroke-width="1.5"/><text x="180" y="390.5" text-anchor="middle" font-size="16" fill="#18394f" font-weight="700">제조 결과 → 후속 패키징·테스트</text></g></svg>
