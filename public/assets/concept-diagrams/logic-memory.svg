<svg xmlns="http://www.w3.org/2000/svg" width="360" height="420" viewBox="0 0 360 420" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">로직·작업 메모리·저장장치</title><desc id="diagram-desc">계산하는 CPU와 GPU, 작업용 DRAM, 저장용 NAND 사이의 데이터 교환 관계。캐시·컨트롤러·버스 등을 생략한 기능 관계입니다.</desc><defs><marker id="arrow-ink" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#18394f"/></marker><marker id="arrow-cyan" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#076171"/></marker><marker id="arrow-amber" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#8b471b"/></marker></defs><rect width="360" height="420" fill="#f7fbfc"/><g font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif"><rect x="62" y="28" width="236" height="76" rx="6" fill="#d9f1f3" stroke="#adc6d3" stroke-width="1.5"/><text x="180" y="55" text-anchor="middle" font-size="16" fill="#18394f" font-weight="700">CPU·GPU</text><text x="180" y="77" text-anchor="middle" font-size="14" fill="#425d70" font-weight="500">계산·제어</text><line x1="167" y1="112" x2="167" y2="151" stroke="#076171" stroke-width="2" marker-end="url(#arrow-cyan)"/><line x1="193" y1="153" x2="193" y2="114" stroke="#076171" stroke-width="2" marker-end="url(#arrow-cyan)"/><text x="249" y="139" text-anchor="middle" font-size="14" fill="#076171" font-weight="500">데이터</text><rect x="62" y="164" width="236" height="76" rx="6" fill="#d9f1f3" stroke="#adc6d3" stroke-width="1.5"/><text x="180" y="191" text-anchor="middle" font-size="16" fill="#18394f" font-weight="700">DRAM</text><text x="180" y="213" text-anchor="middle" font-size="14" fill="#425d70" font-weight="500">작업용·휘발성</text><line x1="167" y1="247" x2="167" y2="286" stroke="#076171" stroke-width="2" marker-end="url(#arrow-cyan)"/><line x1="193" y1="288" x2="193" y2="249" stroke="#076171" stroke-width="2" marker-end="url(#arrow-cyan)"/><rect x="62" y="299" width="236" height="76" rx="6" fill="#d9f1f3" stroke="#adc6d3" stroke-width="1.5"/><text x="180" y="326" text-anchor="middle" font-size="16" fill="#18394f" font-weight="700">NAND 기반 저장장치</text><text x="180" y="348" text-anchor="middle" font-size="14" fill="#425d70" font-weight="500">저장용·비휘발성</text><text x="180" y="407" text-anchor="middle" font-size="14" fill="#425d70" font-weight="500">캐시·컨트롤러 등은 생략한 관계도</text></g></svg>
