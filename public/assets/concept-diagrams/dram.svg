<svg xmlns="http://www.w3.org/2000/svg" width="360" height="430" viewBox="0 0 360 430" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">DRAM 1T1C 셀의 전기적 관계</title><desc id="diagram-desc">워드라인이 접근 트랜지스터를 제어하고 비트라인과 저장 커패시터를 연결하며 감지 회로가 읽기·복원에 참여하는 관계。실제 셀의 물리 단면과 감지 회로 전체를 그린 것은 아닙니다. 커패시터 아래쪽은 기준 전극입니다.</desc><defs><marker id="arrow-ink" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#18394f"/></marker><marker id="arrow-cyan" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#076171"/></marker><marker id="arrow-amber" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#8b471b"/></marker></defs><rect width="360" height="430" fill="#f7fbfc"/><g font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif"><text x="180" y="28" text-anchor="middle" font-size="17" fill="#18394f" font-weight="700">대표적인 1T1C 셀</text><text x="82" y="75" text-anchor="middle" font-size="15" fill="#076171" font-weight="500">비트라인</text><line x1="82" y1="90" x2="82" y2="307" stroke="#076171" stroke-width="3"/><text x="253" y="85" text-anchor="middle" font-size="15" fill="#8b471b" font-weight="500">워드라인</text><line x1="168" y1="104" x2="311" y2="104" stroke="#8b471b" stroke-width="2.5"/><line x1="168" y1="104" x2="168" y2="158" stroke="#8b471b" stroke-width="2.5"/><line x1="145" y1="158" x2="192" y2="158" stroke="#8b471b" stroke-width="3"/><line x1="82" y1="185" x2="140" y2="185" stroke="#076171" stroke-width="2"/><line x1="140" y1="185" x2="140" y2="168" stroke="#076171" stroke-width="2"/><line x1="140" y1="168" x2="196" y2="168" stroke="#076171" stroke-width="3"/><line x1="196" y1="168" x2="196" y2="185" stroke="#076171" stroke-width="2"/><line x1="196" y1="185" x2="269" y2="185" stroke="#076171" stroke-width="2"/><circle cx="82" cy="185" r="3" fill="#076171"/><line x1="269" y1="185" x2="269" y2="229" stroke="#076171" stroke-width="2"/><line x1="246" y1="229" x2="292" y2="229" stroke="#076171" stroke-width="3"/><line x1="246" y1="241" x2="292" y2="241" stroke="#076171" stroke-width="3"/><line x1="269" y1="241" x2="269" y2="272" stroke="#076171" stroke-width="2"/><line x1="252" y1="272" x2="286" y2="272" stroke="#076171" stroke-width="2"/><text x="167" y="213" text-anchor="middle" font-size="14" fill="#18394f" font-weight="500">접근 트랜지스터</text><text x="261" y="313" text-anchor="middle" font-size="14" fill="#18394f" font-weight="500">저장 커패시터</text><text x="270" y="336" text-anchor="middle" font-size="14" fill="#425d70" font-weight="500">기준 전극에 연결</text><rect x="38" y="347" width="165" height="57" rx="6" fill="#d9f1f3" stroke="#adc6d3" stroke-width="1.5"/><text x="120.5" y="381.5" text-anchor="middle" font-size="16" fill="#18394f" font-weight="700">감지·쓰기 회로</text><line x1="82" y1="307" x2="82" y2="347" stroke="#076171" stroke-width="3"/><path d="M44 375 H20 V145 H72" fill="none" stroke="#076171" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-cyan)"/><text x="169" y="423" text-anchor="middle" font-size="14" fill="#425d70" font-weight="500">감지 후 복원·주기적 리프레시</text></g></svg>
