<svg xmlns="http://www.w3.org/2000/svg" width="360" height="480" viewBox="0 0 360 480" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">원료 A → 퍼지 → 원료 B → 퍼지</title><desc id="diagram-desc">원료 A 공급 후 흡착 상태를 유지하며 퍼지하고 원료 B와 반응한 뒤 다시 퍼지하는 ALD 반복 주기。점과 막은 반응 상태의 기호이며 실제 분자 구조나 주기당 원자층 수를 나타내지 않습니다.</desc><defs><marker id="arrow-ink" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#18394f"/></marker><marker id="arrow-cyan" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#076171"/></marker><marker id="arrow-amber" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#8b471b"/></marker></defs><rect width="360" height="480" fill="#f7fbfc"/><g font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif"><text x="195" y="38" text-anchor="middle" font-size="16" fill="#18394f" font-weight="700">① 원료 A 공급</text><rect x="75" y="93" width="240" height="19" rx="1" fill="#dfe8ed" stroke="#adc6d3" stroke-width="1.5"/><circle cx="98" cy="88" r="4" fill="#8b471b"/><circle cx="137" cy="88" r="4" fill="#8b471b"/><circle cx="176" cy="88" r="4" fill="#8b471b"/><circle cx="215" cy="88" r="4" fill="#8b471b"/><circle cx="254" cy="88" r="4" fill="#8b471b"/><circle cx="293" cy="88" r="4" fill="#8b471b"/><circle cx="115" cy="63" r="4" fill="#8b471b"/><circle cx="190" cy="63" r="4" fill="#8b471b"/><circle cx="265" cy="63" r="4" fill="#8b471b"/><line x1="195" y1="116" x2="195" y2="130" stroke="#076171" stroke-width="2" marker-end="url(#arrow-cyan)"/><text x="195" y="147" text-anchor="middle" font-size="16" fill="#18394f" font-weight="700">② 퍼지</text><rect x="75" y="202" width="240" height="19" rx="1" fill="#dfe8ed" stroke="#adc6d3" stroke-width="1.5"/><circle cx="98" cy="197" r="4" fill="#8b471b"/><circle cx="137" cy="197" r="4" fill="#8b471b"/><circle cx="176" cy="197" r="4" fill="#8b471b"/><circle cx="215" cy="197" r="4" fill="#8b471b"/><circle cx="254" cy="197" r="4" fill="#8b471b"/><circle cx="293" cy="197" r="4" fill="#8b471b"/><line x1="270" y1="177" x2="324" y2="177" stroke="#8b471b" stroke-width="2" marker-end="url(#arrow-amber)"/><line x1="195" y1="225" x2="195" y2="239" stroke="#076171" stroke-width="2" marker-end="url(#arrow-cyan)"/><text x="195" y="256" text-anchor="middle" font-size="16" fill="#18394f" font-weight="700">③ 원료 B 반응</text><rect x="75" y="311" width="240" height="19" rx="1" fill="#dfe8ed" stroke="#adc6d3" stroke-width="1.5"/><rect x="75" y="304" width="240" height="7" rx="0" fill="#d9f1f3" stroke="#076171" stroke-width="1.5"/><circle cx="115" cy="281" r="4" fill="#076171"/><circle cx="190" cy="281" r="4" fill="#076171"/><circle cx="265" cy="281" r="4" fill="#076171"/><line x1="195" y1="334" x2="195" y2="348" stroke="#076171" stroke-width="2" marker-end="url(#arrow-cyan)"/><text x="195" y="365" text-anchor="middle" font-size="16" fill="#18394f" font-weight="700">④ 퍼지</text><rect x="75" y="420" width="240" height="19" rx="1" fill="#dfe8ed" stroke="#adc6d3" stroke-width="1.5"/><rect x="75" y="413" width="240" height="7" rx="0" fill="#d9f1f3" stroke="#076171" stroke-width="1.5"/><line x1="270" y1="395" x2="324" y2="395" stroke="#8b471b" stroke-width="2" marker-end="url(#arrow-amber)"/><path d="M68 425 H31 V49 H64" fill="none" stroke="#076171" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-cyan)"/><text x="180" y="468" text-anchor="middle" font-size="14" fill="#425d70" font-weight="500">표면 상태를 바꾸며 주기를 반복</text></g></svg>
