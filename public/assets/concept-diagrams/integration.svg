<svg xmlns="http://www.w3.org/2000/svg" width="360" height="450" viewBox="0 0 360 450" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">2.5D 수평 배치와 3D 수직 결합</title><desc id="diagram-desc">인터포저 위에 두 다이가 나란히 놓인 2.5D 예시와 두 다이가 수직으로 접합된 3D 예시를 비교。대표적인 배치 예시이며 모든 2.5D·3D가 같은 재료와 접합 방식을 쓰지는 않습니다.</desc><defs><marker id="arrow-ink" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#18394f"/></marker><marker id="arrow-cyan" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#076171"/></marker><marker id="arrow-amber" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#8b471b"/></marker></defs><rect width="360" height="450" fill="#f7fbfc"/><g font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif"><rect x="18" y="18" width="324" height="182" rx="6" fill="#ffffff" stroke="#adc6d3" stroke-width="1.5"/><text x="180" y="44" text-anchor="middle" font-size="16" fill="#18394f" font-weight="700">2.5D · 나란히 놓은 다이</text><line x1="59" y1="65" x2="59" y2="72" stroke="#18394f" stroke-width="2"/><line x1="59" y1="118" x2="59" y2="125" stroke="#18394f" stroke-width="2"/><line x1="81" y1="65" x2="81" y2="72" stroke="#18394f" stroke-width="2"/><line x1="81" y1="118" x2="81" y2="125" stroke="#18394f" stroke-width="2"/><line x1="103" y1="65" x2="103" y2="72" stroke="#18394f" stroke-width="2"/><line x1="103" y1="118" x2="103" y2="125" stroke="#18394f" stroke-width="2"/><line x1="125" y1="65" x2="125" y2="72" stroke="#18394f" stroke-width="2"/><line x1="125" y1="118" x2="125" y2="125" stroke="#18394f" stroke-width="2"/><line x1="147" y1="65" x2="147" y2="72" stroke="#18394f" stroke-width="2"/><line x1="147" y1="118" x2="147" y2="125" stroke="