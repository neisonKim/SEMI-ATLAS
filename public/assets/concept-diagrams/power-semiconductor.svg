<svg xmlns="http://www.w3.org/2000/svg" width="360" height="420" viewBox="0 0 360 420" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">전력 스위치의 제어 경로와 전류 경로</title><desc id="diagram-desc">게이트 드라이버가 전력 스위치를 제어하고 전원이 스위치와 부하를 거쳐 연결되는 개념도。대표 스위치의 기능 관계도이며 완성된 전력 변환 회로가 아닙니다.</desc><defs><marker id="arrow-ink" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#18394f"/></marker><marker id="arrow-cyan" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#076171"/></marker><marker id="arrow-amber" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#8b471b"/></marker></defs><rect width="360" height="420" fill="#f7fbfc"/><g font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif"><rect x="89" y="21" width="182" height="64" rx="6" fill="#d9f1f3" stroke="#adc6d3" stroke-width="1.5"/><text x="180" y="48" text-anchor="middle" font-size="16" fill="#18394f" font-weight="700">게이트 드라이버</text><text x="180" y="70" text-anchor="middle" font-size="14" fill="#425d70" font-weight="500">제어 신호 생성</text><line x1="180" y1="93" x2="180" y2="145" stroke="#8b471b" stroke-width="2" marker-end="url(#arrow-amber)"/><text x="233" y="125" text-anchor="middle" font-size="14" fill="#8b471b" font-weight="500">게이트</text><rect x="104" y="156" width="152" height="70" rx="6" fill="#f5d5ad" stroke="#adc6d3" stroke-width="1.5"/><text x="180" y="183" text-anchor="middle" font-size="16" fill="#18394f" font-weight="700">전력 스위치</text><text x="180" y="205" text-anchor="middle" font-size="14" fill="#425d70" font-weight="500">주 전류 경로</text><rect x="18" y="279" width="120" height="65" rx="6" fill="#d9f1f3" stroke="#adc6d3" stroke-width="1.5"/><text x="78" y="317.5" text-anchor="middle" font-size="16" fill="#18394f" font-weight="700">전원</text><rect x="222" y="279" width="120" height="65" rx="6" fill="#d9f1f3" stroke="#adc6d3" stroke-width="1.5"/><text x="282" y="317.5" text-anchor="middle" font-size="16" fill="#18394f" font-weight="700">부하</text><path d="M78 274 V190 H97" fill="none" stroke="#076171" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-cyan)"/><path d="M261 190 H282 V272" fill="none" stroke="#076171" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-cyan)"/><path d="M217 312 H145" fill="none" stroke="#076171" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-cyan)"/><text x="180" y="390" text-anchor="middle" font-size="15" fill="#425d70" font-weight="500">전류 경로와 제어 경로를 구분</text></g></svg>
